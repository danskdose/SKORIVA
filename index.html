<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d0b">
<title>SKORIVA - Live Scores</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d0b;color:white;font-family:Arial,sans-serif}
header{padding:25px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{color:#b9f34b;font-size:25px;font-weight:900;letter-spacing:2px}
.tagline{font-size:9px;color:#91a096;margin-top:4px}
.badge{background:#b9f34b;color:#10170c;padding:10px;border-radius:12px;font-weight:bold}
main{max-width:700px;margin:auto;padding:10px 15px 90px}
.hero{background:linear-gradient(120deg,#203322,#111a13);border:1px solid #34452f;border-radius:20px;padding:22px}
.hero small{color:#b9f34b;letter-spacing:2px;font-weight:bold}
.hero h1{font-size:27px;line-height:1.2}
.hero p{color:#aab6ac;font-size:13px}
.heading{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 15px}
.heading h2{font-size:19px}
.live{color:#b9f34b;font-size:11px;font-weight:bold}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{background:#121b15;border:1px solid #29372d;color:white;padding:11px 18px;border-radius:12px;font-weight:bold}
.tab.active{background:#b9f34b;color:#10170c}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #29372d;background:#121b15;color:white;margin-bottom:12px;font-size:15px}
.refresh{width:100%;padding:12px;background:#b9f34b;color:#10170c;border:0;border-radius:12px;font-weight:bold;margin-bottom:15px}
.league{padding:13px 10px 9px;color:#c2cec4;font-size:12px;font-weight:bold}
.match{display:grid;grid-template-columns:1fr 85px 1fr;align-items:center;gap:6px;padding:17px 12px;margin-bottom:9px;background:#121b15;border:1px solid #29372d;border-radius:15px}
.team{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:bold;min-width:0}
.team span{overflow-wrap:anywhere}
.right{justify-content:flex-end;text-align:right}
.score{text-align:center;font-size:20px;font-weight:900}
.status{display:block;font-size:9px;color:#b9f34b;margin-top:5px}
.star{border:0;background:none;color:#b9f34b;font-size:19px}
.info{margin-top:20px;padding:13px;border:1px dashed #354338;border-radius:12px;color:#91a096;font-size:11px;line-height:1.5}
.message{padding:20px;text-align:center;color:#aab6ac;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d140f;border-top:1px solid #29372d;display:flex;justify-content:space-around;padding:15px 5px}
nav button{background:none;border:0;color:#91a096;font-size:11px}
nav button:first-child{color:#b9f34b}
</style>
</head>
<body>
<header>
<div>
<div class="logo">SKORIVA</div>
<div class="tagline">EVERY MATCH. EVERY MOMENT.</div>
</div>
<div class="badge">⚽</div>
</header>
<main>
<section class="hero">
<small>FOOTBALL LIVE</small>
<h1>Maçın heyecanı<br>tek ekranda.</h1>
<p>Canlı skorlar, fikstürler ve favori takımların.</p>
</section>
<div class="heading">
<h2>Maçlar</h2>
<span class="live">● CANLI MERKEZ</span>
</div>
<div class="tabs">
<button class="tab active" onclick="changeDay('live',this)">Canlı</button>
<button class="tab" onclick="changeDay('today',this)">Bugün</button>
<button class="tab" onclick="changeDay('tomorrow',this)">Yarın</button>
</div>
<input id="search" placeholder="Takım veya lig ara..." oninput="searchMatches()">
<button class="refresh" id="refresh" onclick="loadMatches()">↻ Maçları Yenile</button>
<div id="matches">
<div class="message">Maç verileri yükleniyor...</div>
</div>
<div class="info" id="info">
Veriler API-Football üzerinden alınır. Ücretsiz API kotasını korumak için maçlar otomatik yenilenmez.
</div>
</main>
<nav>
<button>⚽<br>Maçlar</button>
<button>🏆<br>Ligler</button>
<button>☆<br>Favoriler</button>
<button>⚙<br>Ayarlar</button>
</nav>
<script>
const API_URL = "https://aged-fog-6a3d.danskdose.workers.dev/";
let currentDay = "live";
let allMatches = [];
let loading = false;
function dateString(offset=0){
  const d = new Date();
  d.setDate(d.getDate()+offset);
  const year = d.getFullYear();
  const month = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${year}-${month}-${day}`;
}
async function loadMatches(){
  if(loading) return;
  loading = true;
  const button = document.getElementById("refresh");
  const container = document.getElementById("matches");
  button.disabled = true;
  button.innerText = "Yükleniyor...";
  container.innerHTML = '<div class="message">Maçlar getiriliyor...</div>';
  let endpoint = API_URL;
  if(currentDay === "today"){
    endpoint += "?date=" + dateString(0);
  } else if(currentDay === "tomorrow"){
    endpoint += "?date=" + dateString(1);
  }
  try{
    const response = await fetch(endpoint);
    const data = await response.json();
    if(!response.ok || data.errors?.rateLimit){
      throw new Error(data.errors?.rateLimit || "API bağlantı hatası");
    }
    if(data.errors && Object.keys(data.errors).length){
      throw new Error(JSON.stringify(data.errors));
    }
    allMatches = data.response || [];
    renderMatches();
  }catch(error){
    container.innerHTML =
      '<div class="message">⚠️ Maç verileri alınamadı.<br><br>' +
      error.message +
      '<br><br>Biraz sonra tekrar deneyebilirsin.</div>';
  }finally{
    loading = false;
    button.disabled = false;
    button.innerText = "↻ Maçları Yenile";
  }
}
function renderMatches(){
  const container = document.getElementById("matches");
  container.innerHTML = "";
  if(!allMatches.length){
    container.innerHTML =
      '<div class="message">Bu bölümde şu anda maç bulunmuyor.</div>';
    return;
  }
  let filtered = allMatches;
  const query = document.getElementById("search").value.toLowerCase();
  filtered = filtered.filter(m => {
    const home = m.teams?.home?.name || "";
    const away = m.teams?.away?.name || "";
    const league = m.league?.name || "";
    return (home+" "+away+" "+league).toLowerCase().includes(query);
  });
  if(!filtered.length){
    container.innerHTML = '<div class="message">Aramanla eşleşen maç bulunamadı.</div>';
    return;
  }
  let lastLeague = "";
  filtered.forEach(match => {
    const league = match.league?.name || "Diğer Ligler";
    if(league !== lastLeague){
      const heading = document.createElement("div");
      heading.className = "league";
      heading.textContent = "⚽ " + league.toUpperCase();
      container.appendChild(heading);
      lastLeague = league;
    }
    const fixture = match.fixture || {};
    const status = fixture.status || {};
    const goals = match.goals || {};
    const home = match.teams?.home?.name || "Ev sahibi";
    const away = match.teams?.away?.name || "Deplasman";
    const homeGoals = goals.home ?? "-";
    const awayGoals = goals.away ?? "-";
    let matchStatus = status.long || "Programlandı";
    if(status.elapsed !== null && status.elapsed !== undefined){
      matchStatus = status.elapsed + "'";
    }
    const isLive = ["1H","2H","HT","ET","P","LIVE"].includes(status.short);
    const card = document.createElement("div");
    card.className = "match";
    card.innerHTML = `
      <div class="team"><span>${escapeHTML(home)}</span></div>
      <div class="score">
        ${homeGoals} - ${awayGoals}
        <span class="status">${escapeHTML(matchStatus)}</span>
      </div>
      <div class="team right"><span>${escapeHTML(away)}</span>
        <button class="star" aria-label="Favorilere ekle" onclick="favorite(this)">☆</button>
      </div>
    `;
    if(isLive){
      card.style.borderColor = "#b9f34b";
    }
    container.appendChild(card);
  });
}
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}
function changeDay(day,button){
  currentDay = day;
  document.querySelectorAll(".tab").forEach(b=>{
    b.classList.remove("active");
  });
  button.classList.add("active");
  loadMatches();
}
function favorite(button){
  button.innerText = button.innerText === "☆" ? "★" : "☆";
}
function searchMatches(){
  renderMatches();
}
loadMatches();
</script>
</body>
</html>
